services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  cenote:
    build: .
    depends_on: [ollama]
    ports: ["8787:8787"]
    environment:
      CENOTE_OLLAMA_URL: http://ollama:11434
      CENOTE_OLLAMA_EXTRACT_MODEL: llama3.2:3b
      CENOTE_OLLAMA_EMBED_MODEL: nomic-embed-text
      CENOTE_CLOUD_PROVIDER: simulator
      RUST_LOG: cenote=info
    volumes:
      - cenote-data:/data
      - ./fixtures/vault:/data/vault:rw
    restart: unless-stopped

volumes:
  ollama: {}
  cenote-data: {}
